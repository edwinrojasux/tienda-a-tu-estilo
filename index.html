<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <title>Tienda a tu estilo</title>
</head>
<body>
    <header class="header">
        <i class="header__icon"><img class="header__icon-image" src="img/icono_menu.svg" alt="Icono Menú"></i>
        <img class="header__logo" src="img/logo.svg" alt="Logo A tu estilo">
        <i class="header__icon"><img class="header__icon-image" src="img/Carrito.svg" alt="Icono Carrito"></i>
    </header>

    <main>
        <section class="banner">
            <h2 class="banner__title">Productos nuevos</h2>
            <p class="banner__description">Conoce nuestros productos más recientes</p>
        </section>

<section class="products">
    <article class="product-card">
        <img class="product-card__image" src="img/vestido_para_dama_1.webp" alt="Vestido midi para dama">
        <h3 class="product-card__title">Vestido midi</h3>
        <p class="product-card__price">$1,850.00</p>
    </article>

    <article class="product-card">
        <img class="product-card__image" src="img/Chamarra1.jpg" alt="Chamarra urbana para caballero">
        <h3 class="product-card__title">Chamarra urbana</h3>
        <p class="product-card__price">$2,500.00</p>
    </article>

    <article class="product-card">
        <img class="product-card__image" src="img/blusa_para_dama_1.webp" alt="Blusa clásica para dama">
        <h3 class="product-card__title">Blusa clásica</h3>
        <p class="product-card__price">$600.00</p>
    </article>

    <article class="product-card">
        <img class="product-card__image" src="img/vestido_para_dama_2.webp" alt="Vestido elegante para dama">
        <h3 class="product-card__title destination? no">Vestido elegante</h3>
        <p class="product-card__price">$1,950.00</p>
    </article>

    <article class="product-card">
        <img class="product-card__image" src="img/Chamarra2.jpg" alt="Chamarra casual para caballero">
        <h3 class="product-card__title">Chamarra casual</h3>
        <p class="product-card__price">$2,350.00</p>
    </article>

    <article class="product-card">
        <img class="product-card__image" src="img/blusa_para_dama_2.webp" alt="Blusa de verano para dama">
        <h3 class="product-card__title">Blusa de verano</h3>
        <p class="product-card__price">$650.00</p>
    </article>
</section>

        <section class="cart">
            <h2 class="cart__title">CARRITO</h2>
            <div class="cart__item">
                <img class="cart__product-image" src="img/Chamarra1.jpg" alt="Chamarra para caballero">
                <p class="cart__product-name">Chamarra</p>
                <p class="cart__product-price">$2,500.00</p>
                <i class="cart__delete-button"><img class="cart__delete-icon" src="img/icono_quitar.svg" alt="Quitar producto"></i>
            </div>
        </section>
    </main>
</body>
</html>
