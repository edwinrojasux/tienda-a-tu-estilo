<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="css/styles.css">

    <title>Tienda a tu estilo</title>
</head>

<body>
    <header class="header">
        <button class="header__icon" type="button" aria-label="Abrir menú">
            <img
                class="header__icon-image"
                src="img/icono_menu.svg"
                alt=""
                aria-hidden="true"
            >
        </button>

        <a
            class="header__brand"
            href="index.html"
            aria-label="Ir a la página de inicio"
        >
            <img
                class="header__logo"
                src="img/logo.svg"
                alt="A tu estilo"
            >
        </a>

        <button class="header__icon" type="button" aria-label="Abrir carrito">
            <img
                class="header__icon-image"
                src="img/Carrito.svg"
                alt=""
                aria-hidden="true"
            >
        </button>
    </header>

    <main>
        <section class="banner">
            <h1 class="banner__title">Productos nuevos</h1>
            <p class="banner__description">
                Conoce nuestros productos más recientes
            </p>
        </section>

        <section class="products" aria-label="Productos disponibles">
            <article class="product-card">
                <img
                    class="product-card__image"
                    src="img/vestido_para_dama_1.webp"
                    alt="Vestido midi para dama"
                >
                <h2 class="product-card__title">Vestido midi</h2>
                <p class="product-card__price">$1,850.00</p>
            </article>

            <article class="product-card">
                <img
                    class="product-card__image"
                    src="img/Chamarra1.jpg"
                    alt="Chamarra urbana para caballero"
                >
                <h2 class="product-card__title">Chamarra urbana</h2>
                <p class="product-card__price">$2,500.00</p>
            </article>

            <article class="product-card">
                <img
                    class="product-card__image"
                    src="img/blusa_para_dama_1.webp"
                    alt="Blusa clásica para dama"
                >
                <h2 class="product-card__title">Blusa clásica</h2>
                <p class="product-card__price">$600.00</p>
            </article>

            <article class="product-card">
                <img
                    class="product-card__image"
                    src="img/vestido_para_dama_2.webp"
                    alt="Vestido elegante para dama"
                >
                <h2 class="product-card__title">Vestido elegante</h2>
                <p class="product-card__price">$1,950.00</p>
            </article>

            <article class="product-card">
                <img
                    class="product-card__image"
                    src="img/Chamarra2.jpg"
                    alt="Chamarra casual para caballero"
                >
                <h2 class="product-card__title">Chamarra casual</h2>
                <p class="product-card__price">$2,350.00</p>
            </article>

            <article class="product-card">
                <img
                    class="product-card__image"
                    src="img/blusa_para_dama_2.webp"
                    alt="Blusa de verano para dama"
                >
                <h2 class="product-card__title">Blusa de verano</h2>
                <p class="product-card__price">$650.00</p>
            </article>
        </section>

        <section class="cart" aria-label="Carrito de compras">
            <h2 class="cart__title">Carrito</h2>

            <div class="cart__item">
                <img
                    class="cart__product-image"
                    src="img/Chamarra1.jpg"
                    alt="Chamarra para caballero"
                >
                <p class="cart__product-name">Chamarra</p>
                <p class="cart__product-price">$2,500.00</p>

                <button
                    class="cart__delete-button"
                    type="button"
                    aria-label="Quitar chamarra del carrito"
                >
                    <img
                        class="cart__delete-icon"
                        src="img/icono_quitar.svg"
                        alt=""
                        aria-hidden="true"
                    >
                </button>
            </div>
        </section>
    </main>
</body>
</html>
